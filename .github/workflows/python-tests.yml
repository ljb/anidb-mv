name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run ruff check
        run: ruff check

      - name: Run ruff format check
        run: ruff format --check

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Check the package metadata and README
        run: python -m twine check dist/*

      # MANIFEST.in decides what the sdist carries. An earlier sdist shipped the tests
      # without conftest.py, so most of them could not even be imported from it.
      - name: Check the sdist contents
        run: |
          listing=$(tar tzf dist/*.tar.gz)
          for entry in tests/conftest.py tests/smoke.py CHANGELOG.md LICENSE; do
            echo "$listing" | grep -q "/$entry$" || { echo "sdist is missing $entry"; exit 1; }
          done

      # pytest runs against src/ and never sees whether the built package installs and
      # starts. This does: a clean venv, the wheel, and the installed commands.
      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl

      - name: Smoke-test the installed commands
        run: PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH" python tests/smoke.py
