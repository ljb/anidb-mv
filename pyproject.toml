[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anidb-mv"
version = "1.0.0"
description = "Command line client for AniDB"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  {name = "Jonas Bengtsson", email = "jonas@bengtsson.cc"},
]
urls = {Homepage = "https://github.com/ljb/anidb-mv"}
dependencies = [
  "pycryptodomex>=3.23",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11",
  "pytest>=8.4",
]

[project.scripts]
amv = "amv.amv:main"
amv-db = "amv.amv_db:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["amv*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
